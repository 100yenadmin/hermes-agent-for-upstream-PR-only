name: hermes-lcm-x
title: LCM-X
repo: https://github.com/electricsheephq/lcm-x
sha: b9ad016e0a7c1a1d6dad4eb41217b81e248fa4cd
description: 'Lossless context memory engine: instead of lossy compaction, LCM-X keeps every turn in a local SQLite store (lcm.db)
  and builds a recoverable DAG of summaries over it, with 15 lcm_* tools to search, recall and expand earlier context. Select it
  with context.engine: lcm-x. Upgrading from hermes-lcm: add hermes-lcm-x to plugins.enabled (the install script prints the
  steps; the old engine name lcm keeps working with a deprecation warning); lcm.db and the lcm: config block are unchanged.
  Summaries use the model Hermes is configured with. Disclosure — optional semantic recall (embeddings_enabled, off by
  default) sends message text to the embedding provider you configure (Voyage via VOYAGE_API_KEY, or an OpenAI-compatible
  endpoint, or a local Ollama); for known cloud providers the provider-bound copy is privacy-transformed by default
  (LCM_EMBEDDING_PRIVACY_ENABLED=false opts out), while lcm.db keeps the raw text.'
maintainer: electricsheephq
tier: community
category: memory
requires_hermes: '>=0.21.3'
docs_url: https://github.com/electricsheephq/lcm-x#readme
version: "0.24.0"
platforms: []
capabilities:
  provides_tools:
    - lcm_grep
    - lcm_recall
    - lcm_query_state
    - lcm_compute
    - lcm_compile_evidence
    - lcm_evidence_pack
    - lcm_retrieve
    - lcm_recent
    - lcm_load_session
    - lcm_describe
    - lcm_expand
    - lcm_expand_query
    - lcm_status
    - lcm_inspect
    - lcm_doctor
  provides_hooks:
    - pre_llm_call
    - post_llm_call
    - subagent_start
    - subagent_stop
  provides_middleware: []
  requires_env: []
