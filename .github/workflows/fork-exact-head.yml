name: Fork exact-head validation
run-name: "Fork exact-head validation ${{ inputs.target_sha }} ${{ inputs.only }}"

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact 40-character commit SHA to validate
        required: true
        type: string
      only:
        description: Run one job only (python-tests, windows-tests, nix-check, focused or check); empty runs the three suites
        required: false
        type: string
        default: ''
      test_files:
        description: Space-separated test files for only=focused (one unsliced run of just these files)
        required: false
        type: string
        default: ''
      base_sha:
        description: Upstream base commit for scripts/check (health gate); empty skips the check job
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: fork-exact-head-${{ inputs.target_sha }}-${{ inputs.only }}-${{ inputs.base_sha }}-${{ inputs.test_files }}
  cancel-in-progress: false

jobs:
  python-tests:
    name: Python tests ${{ matrix.slice }} (portable runner)
    if: inputs.only == '' || inputs.only == 'python-tests'
    strategy:
      fail-fast: false
      matrix:
        slice: ['1/4', '2/4', '3/4', '4/4']
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_SHA: ${{ inputs.target_sha }}
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
      HERMES_TEST_WORKERS: "4"
      HERMES_TEST_SLICE: ${{ matrix.slice }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target_sha }}

      - name: Verify exact candidate
        shell: bash
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 2
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install ripgrep (prebuilt binary)
        shell: bash
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.14
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.14

      - name: Install locked dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.14 --extra all --group dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra parallel-web --extra keychain

      - name: Verify lock and run canonical suite
        shell: bash
        run: |
          uv lock --check
          source .venv/bin/activate
          scripts/run_tests.sh

  focused-tests:
    name: Focused tests (portable runner)
    if: inputs.only == 'focused' && inputs.test_files != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPECTED_SHA: ${{ inputs.target_sha }}
      TEST_FILES: ${{ inputs.test_files }}
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
      HERMES_TEST_WORKERS: "4"
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1

      - name: Verify exact candidate
        shell: bash
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 2
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install ripgrep (prebuilt binary)
        shell: bash
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.14
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.14

      - name: Install locked dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.14 --extra all --group dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra parallel-web --extra keychain

      - name: Run the selected test files
        shell: bash
        run: |
          source .venv/bin/activate
          read -r -a files <<< "$TEST_FILES"
          scripts/run_tests.sh "${files[@]}"

  health-check:
    name: scripts/check against the upstream base (portable runner)
    if: inputs.base_sha != '' && (inputs.only == '' || inputs.only == 'check' || inputs.only == 'focused')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ inputs.target_sha }}
      BASE_SHA: ${{ inputs.base_sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Verify exact candidate
        shell: bash
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 2
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install ripgrep (prebuilt binary)
        shell: bash
        run: |
          set -euo pipefail
          RG_VERSION=15.1.0
          RG_SHA256=1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599
          RG_TARBALL=ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL --retry 3 --retry-delay 5 -o "$RG_TARBALL" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_TARBALL}"
          echo "${RG_SHA256}  ${RG_TARBALL}" | sha256sum -c -
          tar -xzf "$RG_TARBALL"
          sudo mv "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl/rg" /usr/local/bin/rg
          rm -rf "$RG_TARBALL" "ripgrep-${RG_VERSION}-x86_64-unknown-linux-musl"
          rg --version

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.14
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.14

      - name: Install locked dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.14 --extra all --group dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra parallel-web --extra keychain

      - name: Run scripts/check against the base
        shell: bash
        run: |
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 2
          fi
          git cat-file -e "$BASE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          source .venv/bin/activate
          python scripts/check --base "$BASE_SHA"

  windows-tests:
    name: Windows tests ${{ matrix.slice }} (portable runner)
    if: inputs.only == '' || inputs.only == 'windows-tests'
    strategy:
      fail-fast: false
      matrix:
        slice: ['1/2', '2/2']
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      EXPECTED_SHA: ${{ inputs.target_sha }}
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target_sha }}

      - name: Verify exact candidate
        shell: bash
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 2
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          packages: git,ripgrep
          extras: '["all", "telegram", "anthropic", "mistral", "fal", "modal", "daytona", "parallel-web", "keychain"]'
          test-environment: 'true'
          prune-python-cache: true

      - name: Run windows tests
        # Mirrors the windows leg of upstream tests-os.yml at the candidate's base, minus the
        # desktop-update hand-off tests (upstream runs them only when a PR touches that surface).
        shell: bash
        run: |
          set -uo pipefail
          LIST="${RUNNER_TEMP:-.}/selected-tests.txt"
          if ! python scripts/ci/list_os_marked_tests.py windows > "$LIST"; then
            echo "::error::could not enumerate windows test files"
            exit 1
          fi
          if [ ! -s "$LIST" ]; then
            echo "::error::empty windows file list"
            exit 1
          fi
          echo "selected file(s) for windows:"
          cat "$LIST"
          SEPARATOR="$(python -c 'import os, sys; sys.stdout.write(os.pathsep)')"
          FILES="$(tr -d '\r' < "$LIST" | paste -sd "$SEPARATOR" -)"
          scripts/run_tests.sh --files "$FILES" -- \
            --ignore-glob='*test_desktop_update_windows_*.py' \
            -m "platforms and not integration" \
            -v --tb=short
        env:
          HERMES_TEST_WORKERS: '4'
          HERMES_TEST_SLICE: ${{ matrix.slice }}

  nix-check:
    name: Nix flake check (portable runner)
    if: inputs.only == '' || inputs.only == 'nix-check'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EXPECTED_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.target_sha }}

      - name: Verify exact candidate
        shell: bash
        run: |
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            exit 2
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            fallback = true
            tarball-ttl = 3600

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: fork-nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'nix/**', 'pyproject.toml', 'uv.lock') }}
          restore-prefixes-first-match: fork-nix-${{ runner.os }}-
          save: false

      - name: Run Nix flake check
        run: nix flake check --print-build-logs
